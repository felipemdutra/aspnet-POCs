
services:
  api:
    # Build the image from a Dockerfile instead of pulling one from a
    # registry. `context` is the folder Docker sends to the build engine
    # (the "build context"). The Dockerfile here references paths like
    # `src/UserRegistration.Api/...`, so the context has to be the
    # project root — two directories up from this file.
    build:
      context: ../..
      dockerfile: src/UserRegistration.Api/Dockerfile

    # A friendly name shown by `docker compose ps` and in the logs.
    container_name: user-registration

    # Maps host port 5291 -> container port 5291, so the API is
    # reachable at http://localhost:5291 on your machine.
    ports:
      - "5291:5291"

    # Restart policy: try to keep the container up unless you
    # explicitly stop it. Great for local development and servers.
    restart: unless-stopped

    # Mount a *named* volume at /app/data (where the Dockerfile stores
    # users.db). Named volumes survive `docker compose down` and even
    # container removal — perfect for a SQLite database.
    volumes:
      - api-data:/app/data

    # Environment variables passed into the container. These override
    # the `ENV` values set inside the Dockerfile.
    environment:
      - ASPNETCORE_URLS=http://+:5291
      - ConnectionStrings__Default=Data Source=/app/data/users.db

# ---------------------------------------------------------------------------
# Top-level `volumes` declares the named volumes used above so Compose
# creates them on first run and reuses them afterwards.
# ---------------------------------------------------------------------------
volumes:
  api-data: